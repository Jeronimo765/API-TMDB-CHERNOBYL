<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chernobyl Explorer | Offline</title>
  <meta name="theme-color" content="#b8ff3a" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --card: #111111;
      --text: #f2f0ea;
      --muted: #9a978f;
      --accent: #b8ff3a;
      --border: rgba(184, 255, 58, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(184, 255, 58, 0.12), transparent 35%),
        linear-gradient(180deg, #090909, var(--bg));
      color: var(--text);
    }

    .offline-card {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(17, 17, 17, 0.88);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(184, 255, 58, 0.12);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #080808;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="badge">Modo sin conexion</div>
    <h1>No hay internet disponible</h1>
    <p>La app sigue instalada, pero en este momento no puede consultar TMDB para cargar contenido nuevo.</p>
    <p>Cuando vuelvas a tener conexion, recarga y el explorador continuara funcionando con normalidad.</p>
    <a href="./">Intentar de nuevo</a>
  </main>
</body>
</html>
